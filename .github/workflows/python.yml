name: Python Tests
on: [push, pull_request]

jobs:
  build:
    name: Python Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    steps:
    - uses: actions/checkout@v5

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.1.4
      package-dir: python

    - uses: actions/upload-artifact@v4
      with:
        path: ./wheelhouse/*.whl
